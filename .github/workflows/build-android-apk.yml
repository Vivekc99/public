name: Build Android APK

on:
  push:
    branches: [claude/nas-file-explorer-android-ux7w78]
    paths:
      - 'android-nas-explorer/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        working-directory: android-nas-explorer
        run: ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        run: cp android-nas-explorer/app/build/outputs/apk/release/app-release.apk NAS-Explorer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NAS-Explorer-apk
          path: NAS-Explorer.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nas-explorer-build-${{ github.run_number }}
          name: NAS Explorer build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: NAS-Explorer.apk
